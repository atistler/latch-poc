[[local|localrc]]
DEST=/opt/stack
HOST_IP=172.20.2.15
ADMIN_PASSWORD=latch-openstack
DATABASE_PASSWORD=latch-openstack
RABBIT_PASSWORD=latch-openstack
SERVICE_PASSWORD=latch-openstack
LOGFILE=/opt/stack/logs/stack.sh.log
LOG_COLOR=False
API_WORKERS=1
BUILD_TIMEOUT=1800
SERVICE_TIMEOUT=300
GIT_TIMEOUT=1200
GIT_DEPTH=1
IP_VERSION=4
LIBVIRT_TYPE=qemu
LIBVIRT_CPU_MODE=none
NOVA_CPU_ALLOCATION_RATIO=4
DOWNLOAD_DEFAULT_IMAGES=False

disable_all_services
enable_service mysql rabbit key g-api placement-api placement-client
enable_service n-api n-api-meta n-cpu n-cond n-sch
enable_service q-svc q-agt q-dhcp q-l3 q-meta

Q_AGENT=openvswitch
Q_PLUGIN=ml2
Q_ML2_PLUGIN_MECHANISM_DRIVERS=openvswitch,l2population
Q_ML2_PLUGIN_TYPE_DRIVERS=flat,vlan,vxlan
Q_ML2_TENANT_NETWORK_TYPE=vxlan
Q_DVR_MODE=legacy
Q_SERVICE_PLUGIN_CLASSES=router,port_forwarding
Q_USE_PROVIDERNET_FOR_PUBLIC=True
PUBLIC_PHYSICAL_NETWORK=public
OVS_BRIDGE_MAPPINGS=public:br-ex
PUBLIC_BRIDGE=br-ex
OVS_PHYSICAL_BRIDGE=br-ex
PUBLIC_INTERFACE=
NEUTRON_CREATE_INITIAL_NETWORKS=False
FLOATING_RANGE=100.64.10.0/24
PUBLIC_NETWORK_GATEWAY=100.64.10.1
FIXED_RANGE=192.168.20.0/24

[[post-config|/etc/neutron/l3_agent.ini]]
[DEFAULT]
agent_mode=legacy
[agent]
extensions=port_forwarding

[[post-config|/etc/nova/nova.conf]]
[DEFAULT]
resume_guests_state_on_host_boot=True
[libvirt]
virt_type=qemu
cpu_mode=none

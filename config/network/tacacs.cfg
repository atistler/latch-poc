# Upstream: https://projects.pro-bono-publico.de/event-driven-servers/doc/tac_plus-ng.html
id = spawnd {
    background = no
    listen { port = 49 }
    spawn { instances min = 1 instances max = 8 }
}
id = tac_plus-ng {
    mavis module ldap = external {
        exec = /usr/bin/python3 python3 /usr/local/lib/latch/tacacs-ldap.py
    }
    user backend = mavis
    login backend = mavis
    pap backend = mavis
    cache timeout = 0
    group readonly { }
    group operator { }
    group admin { }
    device freertr {
        address = @FREERTR_ADDRESS@
        key = "@TACACS_SECRET@"
    }
    profile readonly {
        script {
            if (service == shell) {
                if (cmd == "") { set priv-lvl = 15 permit }
                if (cmd =~ /[|] *(redirect|pastebin)( |$)/) deny
                if (cmd =~ /(^| )record( |$)/) deny
                if (cmd =~ /^(show|ping|traceroute|mtr|telnet|ssh|whois|lookup|help|echo)( |$)/) permit
                if (cmd =~ /^(exit|end)( <cr>)?$/) permit
            }
            deny
        }
    }
    profile operator {
        script {
            if (service == latch-config) { optional cmd-arg = "" permit }
            if (service == shell) {
                if (cmd == "") { set priv-lvl = 15 permit }
                if (cmd =~ /[|] *(redirect|pastebin)( |$)/) deny
                if (cmd =~ /(^| )record( |$)/) deny
                if (cmd =~ /^(show|ping|traceroute|mtr|telnet|ssh|whois|lookup|help|echo)( |$)/) permit
                if (cmd =~ /^(exit|end)( <cr>)?$/) permit
                if (cmd =~ /^configure terminal( <cr>)?$/) permit
                if (cmd =~ /^write( memory| terminal)?( <cr>)?$/) permit
            }
            deny
        }
    }
    profile admin {
        script {
            if (service == shell) {
                if (cmd == "") { set priv-lvl = 15 permit }
                permit
            }
            if (service == latch-config) { optional cmd-arg = "" permit }
            deny
        }
    }
    ruleset {
        rule ldap-role {
            script {
                if (member == readonly) { profile = readonly permit }
                if (member == operator) { profile = operator permit }
                if (member == admin) { profile = admin permit }
                deny
            }
        }
    }
}
